<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunar Paradox — Living 3D Room</title>
  <meta name="description" content="Applied graphics laboratory and systems studio. WebGPU compute engines, browser-local ONNX rigging, and AI agent infrastructure.">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #f3f4f6;
      --muted: rgba(243, 244, 246, 0.55);
      --accent: #e2c28d;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #07080c;
      color: var(--text);
      font-family: var(--sans);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      cursor: crosshair;
      -webkit-font-smoothing: antialiased;
    }
    #room-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
    }
    /* Subtle glass-wall edge vignette */
    .glass-overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.65);
      background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 35%, transparent 70%, rgba(255,255,255,0.015) 100%);
    }
    .ui-hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(18px, 3vw, 36px);
    }
    header, footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
    }
    .brand {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text);
      opacity: 0.85;
    }
    .links {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .links a {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.25s;
    }
    .links a:hover { color: var(--accent); }
    .state-hint {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #loader {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #07080c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      transition: opacity 0.6s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loader">INITIALIZING ROOM // DECODING MODEL</div>
  <div id="room-canvas"></div>
  <div class="glass-overlay"></div>

  <div class="ui-hud">
    <header>
      <div class="brand">Lunar Paradox</div>
      <nav class="links">
        <a href="https://lunarparadox.com" target="_blank" rel="noopener">Studio</a>
        <a href="/download/">Downloads</a>
        <a href="https://nff747.github.io/agent-readiness-skill/" target="_blank" rel="noopener">Agent Auditor</a>
        <a href="https://github.com/nff747" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </header>

    <footer>
      <div class="state-hint" id="state-label">ROAMING</div>
      <div class="state-hint">MOVE CURSOR OR TAP GLASS</div>
    </footer>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    const container = document.getElementById('room-canvas');
    const loaderEl = document.getElementById('loader');
    const stateLabel = document.getElementById('state-label');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090b10);
    scene.fog = new THREE.FogExp2(0x090b10, 0.06);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 1.65, 4.8);
    camera.lookAt(0, 0.95, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Realistic PBR Environment Reflections
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.45;

    // Post-Processing Pipeline (Subtle Bloom + ACES Output)
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.18, // strength (only emissive lamp/phone glow)
      0.45, // radius
      1.15  // threshold > 1.0 so white coat/mug don't bloom
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    // --- LIGHTING (Warm cozy room + crisp architectural contrast) ---
    const hemi = new THREE.HemisphereLight(0xfff5e8, 0x262b3d, 1.35);
    scene.add(hemi);

    const lampLight = new THREE.PointLight(0xffcf96, 10.0, 14, 1.4);
    lampLight.position.set(-2.1, 2.1, -0.8);
    lampLight.castShadow = true;
    lampLight.shadow.bias = -0.001;
    scene.add(lampLight);

    const windowFill = new THREE.DirectionalLight(0xdbeafe, 1.45);
    windowFill.position.set(2.5, 2.8, 3.2);
    windowFill.castShadow = true;
    scene.add(windowFill);

    const rimLight = new THREE.DirectionalLight(0xe2c28d, 0.9);
    rimLight.position.set(-1.5, 2.5, -2.5);
    scene.add(rimLight);

    // --- 3D ROOM ARCHITECTURE ---
    const room = new THREE.Group();
    scene.add(room);

    // --- PROCEDURAL PBR TEXTURES ---
    function makeWoodTextures() {
      const size = 512;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const rC = document.createElement('canvas');
      rC.width = rC.height = size;
      const rCtx = rC.getContext('2d');

      ctx.fillStyle = '#2a221d';
      ctx.fillRect(0, 0, size, size);
      rCtx.fillStyle = '#a8a8a8';
      rCtx.fillRect(0, 0, size, size);

      const planks = 8;
      const ph = size / planks;
      for (let p = 0; p < planks; p++) {
        const y0 = p * ph;
        const tone = (p % 3 === 0 ? 6 : p % 2 === 0 ? -5 : 2);
        ctx.fillStyle = `rgb(${42 + tone}, ${33 + tone}, ${28 + tone})`;
        ctx.fillRect(0, y0, size, ph - 2);

        for (let i = 0; i < 45; i++) {
          const gy = y0 + Math.random() * (ph - 3);
          const alpha = 0.04 + Math.random() * 0.08;
          ctx.fillStyle = Math.random() > 0.5 ? `rgba(20,14,10,${alpha})` : `rgba(80,62,48,${alpha})`;
          ctx.fillRect(0, gy, size, 1 + Math.random() * 1.5);
          rCtx.fillStyle = Math.random() > 0.5 ? 'rgba(130,130,130,0.2)' : 'rgba(210,210,210,0.2)';
          rCtx.fillRect(0, gy, size, 1.5);
        }
        // Plank seam
        ctx.fillStyle = '#14100d';
        ctx.fillRect(0, y0 + ph - 2, size, 2);
        rCtx.fillStyle = '#ffffff';
        rCtx.fillRect(0, y0 + ph - 2, size, 2);
      }

      const map = new THREE.CanvasTexture(c);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(4, 4);
      map.anisotropy = 4;

      const roughnessMap = new THREE.CanvasTexture(rC);
      roughnessMap.wrapS = roughnessMap.wrapT = THREE.RepeatWrapping;
      roughnessMap.repeat.set(4, 4);
      return { map, roughnessMap };
    }

    function makeRugTextures() {
      const size = 256;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const bC = document.createElement('canvas');
      bC.width = bC.height = size;
      const bCtx = bC.getContext('2d');

      ctx.fillStyle = '#2d3142';
      ctx.fillRect(0, 0, size, size);
      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, size, size);

      for (let y = 0; y < size; y += 4) {
        for (let x = 0; x < size; x += 4) {
          const alt = ((x + y) / 4) % 2 === 0;
          ctx.fillStyle = alt ? 'rgba(255,255,255,0.035)' : 'rgba(10,12,20,0.08)';
          ctx.fillRect(x, y, 3, 3);
          bCtx.fillStyle = alt ? '#b8b8b8' : '#585858';
          bCtx.fillRect(x, y, 3, 3);
        }
      }

      const map = new THREE.CanvasTexture(c);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(3, 3);

      const bumpMap = new THREE.CanvasTexture(bC);
      bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
      bumpMap.repeat.set(3, 3);
      return { map, bumpMap };
    }

    function makeWallTextures() {
      const size = 256;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const bC = document.createElement('canvas');
      bC.width = bC.height = size;
      const bCtx = bC.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, size);
      grad.addColorStop(0, '#161922');
      grad.addColorStop(1, '#1d212d');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, size, size);

      for (let i = 0; i < 1800; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.015)' : 'rgba(0,0,0,0.025)';
        ctx.fillRect(x, y, 2, 2);
        bCtx.fillStyle = Math.random() > 0.5 ? '#909090' : '#707070';
        bCtx.fillRect(x, y, 2, 2);
      }

      const map = new THREE.CanvasTexture(c);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(2, 1);

      const bumpMap = new THREE.CanvasTexture(bC);
      bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
      bumpMap.repeat.set(2, 1);
      return { map, bumpMap };
    }

    const woodTex = makeWoodTextures();
    const rugTex = makeRugTextures();
    const wallTex = makeWallTextures();

    // Warm Matte Hardwood Floor
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      map: woodTex.map,
      roughnessMap: woodTex.roughnessMap,
      roughness: 0.72,
      metalness: 0.06
    });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 10), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    room.add(floor);

    // Back & Side Walls
    const wallMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      map: wallTex.map,
      bumpMap: wallTex.bumpMap,
      bumpScale: 0.006,
      roughness: 0.88
    });
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 6), wallMat);
    backWall.position.set(0, 3, -2.6);
    backWall.receiveShadow = true;
    room.add(backWall);

    // Subtle Warm Accent Strip behind couch
    const wallStrip = new THREE.Mesh(
      new THREE.BoxGeometry(2.6, 0.03, 0.02),
      new THREE.MeshBasicMaterial({ color: 0xe2c28d })
    );
    wallStrip.position.set(1.1, 1.75, -2.58);
    room.add(wallStrip);

    // Cozy Rug
    const rug = new THREE.Mesh(
      new THREE.CylinderGeometry(1.65, 1.65, 0.02, 48),
      new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: rugTex.map,
        bumpMap: rugTex.bumpMap,
        bumpScale: 0.014,
        roughness: 0.94
      })
    );
    rug.position.set(0.2, 0.01, -0.3);
    rug.receiveShadow = true;
    room.add(rug);

    // Couch (Right-Back) with Throw Pillows
    const couchGroup = new THREE.Group();
    const couchMat = new THREE.MeshStandardMaterial({ color: 0x33384a, roughness: 0.82 });
    const couchBase = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.42, 0.95), couchMat);
    couchBase.position.y = 0.21;
    couchBase.castShadow = true;
    couchBase.receiveShadow = true;
    couchGroup.add(couchBase);

    const couchBack = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.55, 0.22), couchMat);
    couchBack.position.set(0, 0.62, -0.36);
    couchBack.castShadow = true;
    couchGroup.add(couchBack);

    const armL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.52, 0.95), couchMat);
    armL.position.set(-1.0, 0.36, 0);
    couchGroup.add(armL);
    const armR = armL.clone();
    armR.position.x = 1.0;
    couchGroup.add(armR);

    const pillowMat = new THREE.MeshStandardMaterial({ color: 0xe2c28d, roughness: 0.9 });
    const pillow = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.32, 0.14), pillowMat);
    pillow.position.set(-0.62, 0.54, -0.18);
    pillow.rotation.set(-0.2, 0.25, 0.12);
    pillow.castShadow = true;
    couchGroup.add(pillow);

    couchGroup.position.set(1.1, 0, -1.65);
    couchGroup.rotation.y = -0.18;
    room.add(couchGroup);

    // Low Coffee Table
    const tableGroup = new THREE.Group();
    const tableTop = new THREE.Mesh(
      new THREE.BoxGeometry(1.1, 0.05, 0.6),
      new THREE.MeshStandardMaterial({ color: 0x3a322d, roughness: 0.5 })
    );
    tableTop.position.y = 0.34;
    tableTop.castShadow = true;
    tableTop.receiveShadow = true;
    tableGroup.add(tableTop);
    const legGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.34, 8);
    const legMat = new THREE.MeshStandardMaterial({ color: 0x1a1c24, metalness: 0.7, roughness: 0.3 });
    for (const [lx, lz] of [[-0.48, -0.24], [0.48, -0.24], [-0.48, 0.24], [0.48, 0.24]]) {
      const leg = new THREE.Mesh(legGeo, legMat);
      leg.position.set(lx, 0.17, lz);
      leg.castShadow = true;
      tableGroup.add(leg);
    }
    const mug = new THREE.Mesh(
      new THREE.CylinderGeometry(0.04, 0.035, 0.09, 16),
      new THREE.MeshStandardMaterial({ color: 0xf3f4f6, roughness: 0.3 })
    );
    mug.position.set(0.2, 0.41, 0.05);
    tableGroup.add(mug);
    tableGroup.position.set(0.85, 0, -0.45);
    tableGroup.rotation.y = -0.18;
    room.add(tableGroup);

    // Warm Floor Lamp (Left-Back)
    const lampStand = new THREE.Mesh(
      new THREE.CylinderGeometry(0.03, 0.04, 2.0, 16),
      new THREE.MeshStandardMaterial({ color: 0x2a2d3a, metalness: 0.6, roughness: 0.4 })
    );
    lampStand.position.set(-2.1, 1.0, -1.0);
    room.add(lampStand);

    const lampShade = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.28, 0.32, 24, 1, true),
      new THREE.MeshStandardMaterial({ color: 0xffd7a8, emissive: 0xffb366, emissiveIntensity: 0.85, side: THREE.DoubleSide })
    );
    lampShade.position.set(-2.1, 2.05, -1.0);
    room.add(lampShade);

    // Phone prop for Doom-Scrolling (glowing screen)
    const phoneGroup = new THREE.Group();
    const phoneMesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.09, 0.17, 0.012),
      new THREE.MeshStandardMaterial({ color: 0x050508, emissive: 0x5eead4, emissiveIntensity: 0.9 })
    );
    const phoneGlow = new THREE.PointLight(0x7dd3fc, 0.9, 1.2);
    phoneGlow.position.set(0, 0, 0.08);
    phoneGroup.add(phoneMesh, phoneGlow);
    phoneGroup.visible = false;

    // Sleeping Zzz & Drool particles
    const zzzGroup = new THREE.Group();
    const zzzSprites = [];
    for (let i = 0; i < 3; i++) {
      const s = new THREE.Mesh(
        new THREE.SphereGeometry(0.025 + i * 0.008, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xe2c28d, transparent: true, opacity: 0.6 })
      );
      zzzSprites.push(s);
      zzzGroup.add(s);
    }
    zzzGroup.visible = false;

    // --- CHARACTER LOADING (WITH DRACO) ---
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    const charPivot = new THREE.Group();
    scene.add(charPivot);
    charPivot.add(phoneGroup);
    charPivot.add(zzzGroup);

    let charLoaded = false;
    let charHeight = 1.65;
    let mixer = null;
    const actions = {};
    let activeAction = null;
    let headBone = null, neckBone = null, spineBone = null;

    // Sleep drool droplet
    const droolMat = new THREE.MeshStandardMaterial({
      color: 0xd8f0ff,
      roughness: 0.08,
      metalness: 0.1,
      transparent: true,
      opacity: 0.78
    });
    const droolMesh = new THREE.Mesh(new THREE.SphereGeometry(0.018, 12, 12), droolMat);
    droolMesh.visible = false;
    charPivot.add(droolMesh);

    // Spring-damper secondary motion state
    const spring = {
      yaw: 0, pitch: 0, roll: 0,
      vYaw: 0, vPitch: 0, vRoll: 0
    };
    const prevPivotPos = new THREE.Vector3();

    function playClip(name) {
      if (!actions[name] || activeAction === actions[name]) return;
      const next = actions[name];
      next.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).fadeIn(0.35).play();
      if (activeAction) activeAction.fadeOut(0.35);
      activeAction = next;
    }

    gltfLoader.load('./models/anime_character.glb', (gltf) => {
      const model = gltf.scene;
      model.traverse((obj) => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
          obj.frustumCulled = false;
          if (obj.material) {
            obj.material.side = THREE.DoubleSide;
            obj.material.depthWrite = true;
            if (obj.material.transparent && obj.material.opacity >= 0.99) {
              obj.material.transparent = false;
            }
          }
        }
        if (obj.isBone) {
          if (!headBone && /head/i.test(obj.name)) headBone = obj;
          else if (!neckBone && /neck/i.test(obj.name)) neckBone = obj;
          else if (!spineBone && /spine/i.test(obj.name)) spineBone = obj;
        }
      });

      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      const scale = charHeight / Math.max(size.y, 0.01);
      model.scale.setScalar(scale);
      model.position.set(-center.x * scale, -box.min.y * scale, -center.z * scale);

      charPivot.add(model);
      phoneGroup.position.set(0.14, 1.05, 0.32);
      phoneGroup.rotation.x = -0.35;
      zzzGroup.position.set(0.18, 1.55, 0.1);

      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(model);
        for (const clip of gltf.animations) {
          actions[clip.name] = mixer.clipAction(clip);
        }
        playClip('Idle');
      }

      charLoaded = true;
      loaderEl.classList.add('hidden');
    }, undefined, (err) => {
      console.error('GLB load error:', err);
      loaderEl.textContent = 'MODEL ERROR — CHECK CONSOLE';
    });

    // --- AUTONOMOUS LIVING STATE MACHINE ---
    const STATES = ['ROAMING', 'SITTING', 'DOOM_SCROLLING', 'SLEEPING'];
    let state = 'ROAMING';
    let stateTimer = 0;
    let stateDuration = 7;

    const waypoints = [
      new THREE.Vector3(-0.9, 0, 0.2),
      new THREE.Vector3(0.2, 0, 0.6),
      new THREE.Vector3(-1.3, 0, -0.7),
      new THREE.Vector3(0.4, 0, -0.4)
    ];
    let targetPos = waypoints[0].clone();
    const couchPos = new THREE.Vector3(1.05, 0.42, -1.35);

    // --- ATMOSPHERIC DUST MOTES ---
    const dustCount = 90;
    const dustGeo = new THREE.BufferGeometry();
    const dustPositions = new Float32Array(dustCount * 3);
    const dustPhases = new Float32Array(dustCount);
    for (let i = 0; i < dustCount; i++) {
      dustPositions[i * 3] = -2.6 + Math.random() * 4.8;
      dustPositions[i * 3 + 1] = 0.35 + Math.random() * 2.35;
      dustPositions[i * 3 + 2] = -2.0 + Math.random() * 3.4;
      dustPhases[i] = Math.random() * Math.PI * 2;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
    const dustCanvas = document.createElement('canvas');
    dustCanvas.width = dustCanvas.height = 64;
    const dCtx = dustCanvas.getContext('2d');
    const dGrad = dCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
    dGrad.addColorStop(0, 'rgba(255, 235, 195, 1)');
    dGrad.addColorStop(0.4, 'rgba(255, 215, 160, 0.45)');
    dGrad.addColorStop(1, 'rgba(255, 200, 140, 0)');
    dCtx.fillStyle = dGrad;
    dCtx.fillRect(0, 0, 64, 64);
    const dustMat = new THREE.PointsMaterial({
      map: new THREE.CanvasTexture(dustCanvas),
      size: 0.048,
      transparent: true,
      opacity: 0.5,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const dustPoints = new THREE.Points(dustGeo, dustMat);
    scene.add(dustPoints);

    // --- CHARACTER CONTACT SHADOW ---
    const aoCanvas = document.createElement('canvas');
    aoCanvas.width = aoCanvas.height = 128;
    const aoCtx = aoCanvas.getContext('2d');
    const aoGrad = aoCtx.createRadialGradient(64, 64, 4, 64, 64, 62);
    aoGrad.addColorStop(0, 'rgba(0, 0, 0, 0.65)');
    aoGrad.addColorStop(0.55, 'rgba(0, 0, 0, 0.25)');
    aoGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    aoCtx.fillStyle = aoGrad;
    aoCtx.fillRect(0, 0, 128, 128);
    const contactShadowMat = new THREE.MeshBasicMaterial({
      map: new THREE.CanvasTexture(aoCanvas),
      transparent: true,
      opacity: 0.48,
      depthWrite: false
    });
    const contactShadow = new THREE.Mesh(new THREE.PlaneGeometry(0.72, 0.72), contactShadowMat);
    contactShadow.rotation.x = -Math.PI / 2;
    contactShadow.position.y = 0.015;
    scene.add(contactShadow);

    const cursor = { x: 0, y: 0, active: false };
    window.addEventListener('pointermove', (e) => {
      cursor.x = (e.clientX / window.innerWidth) * 2 - 1;
      cursor.y = (e.clientY / window.innerHeight) * 2 - 1;
      cursor.active = true;
    });

    // Tap on the glass wall to wake her up or call her over
    window.addEventListener('pointerdown', (e) => {
      const nx = (e.clientX / window.innerWidth) * 2 - 1;
      targetPos.set(nx * 1.6, 0, 0.75);
      state = 'ROAMING';
      stateTimer = 0;
      stateDuration = 6;
      stateLabel.textContent = 'COMING TO GLASS';
    });

    function switchState(next) {
      state = next;
      stateTimer = 0;
      stateLabel.textContent = state.replace('_', ' ');
      if (state === 'ROAMING') {
        targetPos.copy(waypoints[Math.floor(Math.random() * waypoints.length)]);
        stateDuration = 6 + Math.random() * 4;
      } else if (state === 'SITTING') {
        targetPos.copy(couchPos);
        stateDuration = 5 + Math.random() * 3;
      } else if (state === 'DOOM_SCROLLING') {
        targetPos.copy(couchPos);
        stateDuration = 7 + Math.random() * 4;
      } else if (state === 'SLEEPING') {
        targetPos.copy(couchPos);
        stateDuration = 8 + Math.random() * 4;
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.getElapsedTime();

      if (charLoaded) {
        if (mixer) mixer.update(dt);
        stateTimer += dt;
        if (stateTimer >= stateDuration) {
          const nextIdx = (STATES.indexOf(state) + 1) % STATES.length;
          switchState(STATES[nextIdx]);
        }

        // Smooth movement toward targetPos
        const dx = targetPos.x - charPivot.position.x;
        const dz = targetPos.z - charPivot.position.z;
        const dist = Math.hypot(dx, dz);

        if (dist > 0.04) {
          playClip('Walk');
          const speed = 0.85 * dt;
          charPivot.position.x += (dx / dist) * Math.min(speed, dist);
          charPivot.position.z += (dz / dist) * Math.min(speed, dist);
          const stepBounce = dist > 0.35 ? Math.abs(Math.sin(t * 9.0)) * 0.018 : 0;
          const walkTargetY = (dist > 0.35 ? 0 : targetPos.y) + stepBounce;
          charPivot.position.y = THREE.MathUtils.lerp(charPivot.position.y, walkTargetY, 0.12);

          const targetAngle = Math.atan2(dx, dz);
          charPivot.rotation.y = THREE.MathUtils.lerp(charPivot.rotation.y, targetAngle, 0.08);
          charPivot.rotation.x = THREE.MathUtils.lerp(charPivot.rotation.x, 0, 0.1);
        } else {
          // Idle / Couch postures
          charPivot.position.y = THREE.MathUtils.lerp(charPivot.position.y, targetPos.y, 0.1);
          if (state === 'SLEEPING') {
            playClip('Sleep');
            charPivot.rotation.y = THREE.MathUtils.lerp(charPivot.rotation.y, -0.2, 0.05);
          } else if (state === 'DOOM_SCROLLING' || state === 'SITTING') {
            playClip('Sit');
            charPivot.rotation.y = THREE.MathUtils.lerp(charPivot.rotation.y, -0.15, 0.06);
          } else {
            playClip('Idle');
            const lookYaw = cursor.active ? cursor.x * 0.45 : Math.sin(t * 0.5) * 0.2;
            charPivot.rotation.y = THREE.MathUtils.lerp(charPivot.rotation.y, lookYaw, 0.05);
          }
        }

        // Props visibility & micro-animation
        phoneGroup.visible = state === 'DOOM_SCROLLING' && dist < 0.25;
        const isSleeping = state === 'SLEEPING' && dist < 0.25;
        zzzGroup.visible = isSleeping;
        droolMesh.visible = isSleeping;

        if (isSleeping) {
          zzzSprites.forEach((s, i) => {
            const phase = (t * 0.7 + i * 0.33) % 1;
            s.position.y = phase * 0.45;
            s.position.x = Math.sin(phase * 4) * 0.06;
            s.material.opacity = (1 - phase) * 0.75;
          });
          const dPhase = (t * 0.45) % 1;
          droolMesh.position.set(0.05, 1.34 - dPhase * 0.14, 0.14);
          const s = 0.6 + Math.sin(dPhase * Math.PI) * 0.6;
          droolMesh.scale.set(s * 0.85, s * 1.25, s * 0.85);
          droolMat.opacity = (1 - dPhase) * 0.82;
        }

        // Spring-damper secondary motion on Head / Neck / Spine
        const vx = (charPivot.position.x - prevPivotPos.x) / Math.max(dt, 0.001);
        const vz = (charPivot.position.z - prevPivotPos.z) / Math.max(dt, 0.001);
        prevPivotPos.copy(charPivot.position);
        const speedMag = Math.hypot(vx, vz);

        const targetYaw = isSleeping ? Math.sin(t * 0.8) * 0.04 : (cursor.active ? cursor.x * 0.28 : Math.sin(t * 0.6) * 0.08);
        const targetPitch = isSleeping ? 0.14 + Math.sin(t * 1.6) * 0.03 : (cursor.active ? -cursor.y * 0.18 : 0) + Math.min(speedMag * 0.08, 0.12);
        const targetRoll = THREE.MathUtils.clamp(-vx * 0.08, -0.14, 0.14);

        const k = 42, damp = 7.5;
        spring.vYaw += ((targetYaw - spring.yaw) * k - spring.vYaw * damp) * dt;
        spring.vPitch += ((targetPitch - spring.pitch) * k - spring.vPitch * damp) * dt;
        spring.vRoll += ((targetRoll - spring.roll) * k - spring.vRoll * damp) * dt;
        spring.yaw += spring.vYaw * dt;
        spring.pitch += spring.vPitch * dt;
        spring.roll += spring.vRoll * dt;

        if (headBone) {
          headBone.rotation.y += THREE.MathUtils.clamp(spring.yaw * 0.55, -0.35, 0.35);
          headBone.rotation.x += THREE.MathUtils.clamp(spring.pitch * 0.55, -0.25, 0.25);
          headBone.rotation.z += THREE.MathUtils.clamp(spring.roll * 0.5, -0.2, 0.2);
        }
        if (neckBone) {
          neckBone.rotation.y += THREE.MathUtils.clamp(spring.yaw * 0.3, -0.2, 0.2);
          neckBone.rotation.x += THREE.MathUtils.clamp(spring.pitch * 0.3, -0.15, 0.15);
        }
        if (spineBone) {
          const breath = Math.sin(t * (isSleeping ? 1.4 : 2.2)) * 0.016;
          spineBone.rotation.z += THREE.MathUtils.clamp(spring.roll * 0.35, -0.15, 0.15);
          spineBone.rotation.x += THREE.MathUtils.clamp(spring.pitch * 0.18, -0.1, 0.1) + breath;
        }

        // Update contact shadow under character (fades when sitting on couch)
        contactShadow.position.x = charPivot.position.x;
        contactShadow.position.z = charPivot.position.z;
        contactShadowMat.opacity = THREE.MathUtils.clamp(1 - charPivot.position.y / 0.35, 0, 1) * 0.48;
      }

      // Drift atmospheric dust motes
      const dPos = dustGeo.attributes.position.array;
      for (let i = 0; i < dustCount; i++) {
        const p = dustPhases[i];
        dPos[i * 3] += Math.sin(t * 0.35 + p) * 0.0006;
        dPos[i * 3 + 1] += Math.cos(t * 0.25 + p * 1.3) * 0.0004;
        dPos[i * 3 + 2] += Math.sin(t * 0.3 + p * 0.7) * 0.0005;
      }
      dustGeo.attributes.position.needsUpdate = true;

      // Subtle camera parallax with cursor
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, cursor.x * 0.22, 0.04);
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, 1.65 - cursor.y * 0.12, 0.04);
      camera.lookAt(0, 0.95, -0.4);

      composer.render();
    }
    animate();
  </script>
</body>
</html>
