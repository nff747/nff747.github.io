<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunar Paradox — Living 3D Room &amp; WebGPU Systems</title>
  <meta name="description" content="Applied graphics laboratory and systems studio. WebGPU compute engines, browser-local ONNX rigging, lock-free concurrency, and AI agent infrastructure.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --surface: rgba(10, 12, 18, 0.55);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f4f4f6;
      --muted: #9ca3af;
      --accent: #e2c28d;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #06070a;
      color: var(--text);
      font-family: var(--sans);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #room-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
    }
    /* Subtle glass-wall framing */
    .glass-frame {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .ui-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(16px, 2.5vw, 32px);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      backdrop-filter: blur(14px);
    }
    .brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    nav {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    nav a {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      backdrop-filter: blur(14px);
      transition: border-color 0.2s, color 0.2s;
    }
    nav a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
      pointer-events: auto;
    }
    .state-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 14px;
      backdrop-filter: blur(16px);
    }
    .state-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .state-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .state-btn {
      font-family: var(--mono);
      font-size: 0.68rem;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .state-btn:hover, .state-btn.active {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(226, 194, 141, 0.14);
    }

    .projects-strip {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .proj-pill {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px 13px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      text-decoration: none;
      transition: border-color 0.2s, transform 0.2s;
    }
    .proj-pill:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .proj-name {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text);
      font-weight: 500;
    }
    .proj-meta {
      font-size: 0.65rem;
      color: var(--muted);
    }
    @media (max-width: 768px) {
      .projects-strip { display: none; }
    }
  </style>
</head>
<body>
  <div id="room-canvas"></div>
  <div class="glass-frame"></div>

  <div class="ui-layer">
    <header>
      <div class="brand">
        <span class="brand-dot"></span>
        <span>Lunar Paradox // Room 01</span>
      </div>
      <nav>
        <a href="https://lunarparadox.com" target="_blank" rel="noopener">Studio</a>
        <a href="/download/">Downloads</a>
        <a href="https://nff747.github.io/agent-readiness-skill/" target="_blank" rel="noopener">Agent Auditor</a>
        <a href="https://github.com/nff747" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </header>

    <div class="bottom-bar">
      <div class="state-panel">
        <div class="state-status" id="state-label">● STATE: ROAMING</div>
        <div class="state-pills">
          <button class="state-btn active" data-state="ROAMING">Roam</button>
          <button class="state-btn" data-state="COUCH">Sit on Couch</button>
          <button class="state-btn" data-state="DOOMSCROLLING">Doomscroll</button>
          <button class="state-btn" data-state="SLEEPING">Sleep &amp; Drool</button>
        </div>
      </div>

      <div class="projects-strip">
        <a class="proj-pill" href="https://github.com/nff747/agent-readiness-skill" target="_blank" rel="noopener">
          <span class="proj-name">agent-readiness-skill</span>
          <span class="proj-meta">18-Spec Agent Infra</span>
        </a>
        <a class="proj-pill" href="https://github.com/nff747/auto-rig-web" target="_blank" rel="noopener">
          <span class="proj-name">auto-rig-web</span>
          <span class="proj-meta">ONNX Rigging · 18ms</span>
        </a>
        <a class="proj-pill" href="https://github.com/nff747/splat-bvh-core" target="_blank" rel="noopener">
          <span class="proj-name">splat-bvh-core</span>
          <span class="proj-meta">10M Splat LBVH</span>
        </a>
        <a class="proj-pill" href="https://github.com/nff747/webgpu-vram-pager" target="_blank" rel="noopener">
          <span class="proj-name">webgpu-vram-pager</span>
          <span class="proj-meta">GPU Virtual Memory</span>
        </a>
        <a class="proj-pill" href="https://github.com/nff747/turbo-ring-ipc" target="_blank" rel="noopener">
          <span class="proj-name">turbo-ring-ipc</span>
          <span class="proj-meta">Lock-Free IPC</span>
        </a>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    const container = document.getElementById('room-canvas');
    const stateLabel = document.getElementById('state-label');
    const stateBtns = document.querySelectorAll('.state-btn');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0c10);
    scene.fog = new THREE.FogExp2(0x0b0c10, 0.08);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 1.45, 4.2);
    camera.lookAt(0, 0.95, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- 3D ROOM BEHIND THE GLASS WALL ---
    const room = new THREE.Group();
    scene.add(room);

    // Floor
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1715, roughness: 0.75, metalness: 0.05 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 8), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    room.add(floor);

    // Back & Side Walls
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x13151c, roughness: 0.9 });
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 5), wallMat);
    backWall.position.set(0, 2.5, -2.5);
    backWall.receiveShadow = true;
    room.add(backWall);

    const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 5), wallMat);
    leftWall.rotation.y = Math.PI / 2;
    leftWall.position.set(-4.2, 2.5, 0);
    room.add(leftWall);

    const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 5), wallMat);
    rightWall.rotation.y = -Math.PI / 2;
    rightWall.position.set(4.2, 2.5, 0);
    room.add(rightWall);

    // Cozy Rug
    const rug = new THREE.Mesh(
      new THREE.CylinderGeometry(1.5, 1.5, 0.02, 48),
      new THREE.MeshStandardMaterial({ color: 0x242129, roughness: 0.95 })
    );
    rug.position.set(0, 0.01, -0.2);
    rug.receiveShadow = true;
    room.add(rug);

    // Couch (Left-Center)
    const couch = new THREE.Group();
    const couchMat = new THREE.MeshStandardMaterial({ color: 0x2b2d3a, roughness: 0.85 });
    const couchBase = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.36, 0.9), couchMat);
    couchBase.position.y = 0.22;
    couchBase.castShadow = true;
    couchBase.receiveShadow = true;
    couch.add(couchBase);

    const couchBack = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.55, 0.22), couchMat);
    couchBack.position.set(0, 0.55, -0.34);
    couchBack.castShadow = true;
    couch.add(couchBack);

    const armL = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.45, 0.9), couchMat);
    armL.position.set(-0.94, 0.4, 0);
    couch.add(armL);
    const armR = armL.clone();
    armR.position.x = 0.94;
    couch.add(armR);

    couch.position.set(-1.35, 0, -1.25);
    couch.rotation.y = 0.25;
    room.add(couch);

    // Desk & Glowing Monitor (Right)
    const desk = new THREE.Group();
    const deskTop = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 0.06, 0.7),
      new THREE.MeshStandardMaterial({ color: 0x241e1a, roughness: 0.6 })
    );
    deskTop.position.y = 0.75;
    deskTop.castShadow = true;
    desk.add(deskTop);

    const monitor = new THREE.Mesh(
      new THREE.BoxGeometry(0.72, 0.42, 0.03),
      new THREE.MeshStandardMaterial({ color: 0x0d1117, emissive: 0x164e63, emissiveIntensity: 0.85 })
    );
    monitor.position.set(0, 1.05, -0.2);
    desk.add(monitor);

    desk.position.set(1.75, 0, -1.35);
    desk.rotation.y = -0.3;
    room.add(desk);

    // Warm Floor Lamp
    const lampPole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.025, 0.035, 1.8, 12),
      new THREE.MeshStandardMaterial({ color: 0x1f2026, metalness: 0.7, roughness: 0.3 })
    );
    lampPole.position.set(-2.6, 0.9, -1.8);
    room.add(lampPole);

    const lampShade = new THREE.Mesh(
      new THREE.ConeGeometry(0.22, 0.28, 24, 1, true),
      new THREE.MeshStandardMaterial({ color: 0xffe4b5, emissive: 0xffb347, emissiveIntensity: 0.65, side: THREE.DoubleSide })
    );
    lampShade.position.set(-2.6, 1.82, -1.8);
    room.add(lampShade);

    // --- LIGHTING (Natural sRGB + Warm Room) ---
    scene.add(new THREE.HemisphereLight(0xfff5e8, 0x141622, 0.95));

    const lampLight = new THREE.PointLight(0xffbe73, 4.5, 7);
    lampLight.position.set(-2.4, 1.75, -1.6);
    lampLight.castShadow = true;
    scene.add(lampLight);

    const keyLight = new THREE.DirectionalLight(0xfff3e4, 1.45);
    keyLight.position.set(1.5, 3.0, 3.0);
    keyLight.castShadow = true;
    scene.add(keyLight);

    const monitorLight = new THREE.PointLight(0x38bdf8, 1.4, 3.5);
    monitorLight.position.set(1.6, 1.15, -1.1);
    scene.add(monitorLight);

    // --- FLOATING DUST MOTES ---
    const moteGeo = new THREE.BufferGeometry();
    const moteCount = 90;
    const motePos = new Float32Array(moteCount * 3);
    for (let i = 0; i < moteCount; i++) {
      motePos[i * 3] = (Math.random() - 0.5) * 6;
      motePos[i * 3 + 1] = Math.random() * 2.8 + 0.2;
      motePos[i * 3 + 2] = (Math.random() - 0.5) * 4;
    }
    moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
    const motes = new THREE.Points(
      moteGeo,
      new THREE.PointsMaterial({ color: 0xffe8c2, size: 0.018, transparent: true, opacity: 0.45 })
    );
    scene.add(motes);

    // --- PHONE PROP (For Doomscrolling) ---
    const phone = new THREE.Mesh(
      new THREE.BoxGeometry(0.08, 0.15, 0.01),
      new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x60a5fa, emissiveIntensity: 1.3 })
    );
    phone.visible = false;
    const phoneLight = new THREE.PointLight(0x60a5fa, 0.9, 1.2);
    phone.add(phoneLight);
    scene.add(phone);

    // --- ZZZ SPRITES (For Sleeping & Drooling) ---
    const zzzGroup = new THREE.Group();
    zzzGroup.visible = false;
    scene.add(zzzGroup);
    function makeZzzSprite(scale) {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#e2c28d';
      ctx.font = 'bold 42px monospace';
      ctx.fillText('Z', 16, 48);
      const tex = new THREE.CanvasTexture(c);
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.85 }));
      sp.scale.set(scale, scale, 1);
      return sp;
    }
    const zSprites = [makeZzzSprite(0.16), makeZzzSprite(0.12), makeZzzSprite(0.09)];
    zSprites.forEach((s) => zzzGroup.add(s));

    // --- CHARACTER LOADING WITH DRACOLOADER ---
    const charPivot = new THREE.Group();
    scene.add(charPivot);
    let modelLoaded = false;

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    gltfLoader.load('./models/anime_character.glb', (gltf) => {
      const model = gltf.scene;
      model.traverse((obj) => {
        if (obj.isMesh) {
          obj.frustumCulled = false;
          obj.castShadow = true;
          obj.receiveShadow = true;
        }
      });

      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const scale = 1.65 / Math.max(size.x, size.y, size.z);
      model.scale.setScalar(scale);

      // Place feet at y = 0 inside charPivot
      model.position.x = -center.x * scale;
      model.position.y = -box.min.y * scale;
      model.position.z = -center.z * scale;

      charPivot.add(model);
      modelLoaded = true;
    });

    // --- AUTONOMOUS LIFE STATE MACHINE ---
    let currentState = 'ROAMING';
    let stateTimer = 0;
    let roamTarget = new THREE.Vector3(0.4, 0, -0.3);
    const pointer = { x: 0, y: 0 };

    window.addEventListener('pointermove', (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = (e.clientY / window.innerHeight) * 2 - 1;
    });

    function setState(newState) {
      currentState = newState;
      stateTimer = 0;
      stateLabel.textContent = `● STATE: ${newState}`;
      stateBtns.forEach((b) => b.classList.toggle('active', b.dataset.state === newState));
      if (newState === 'ROAMING') {
        roamTarget.set((Math.random() - 0.5) * 2.4, 0, (Math.random() - 0.5) * 1.4 - 0.2);
      }
    }

    stateBtns.forEach((btn) => {
      btn.addEventListener('click', () => setState(btn.dataset.state));
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    const statesOrder = ['ROAMING', 'COUCH', 'DOOMSCROLLING', 'SLEEPING'];

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.getElapsedTime();
      stateTimer += dt;

      // Auto-cycle states every 14 seconds
      if (stateTimer > 14) {
        const nextIdx = (statesOrder.indexOf(currentState) + 1) % statesOrder.length;
        setState(statesOrder[nextIdx]);
      }

      // Dust motes drift
      motes.rotation.y = t * 0.02;

      if (modelLoaded) {
        phone.visible = currentState === 'DOOMSCROLLING';
        zzzGroup.visible = currentState === 'SLEEPING';

        if (currentState === 'ROAMING') {
          const dist = charPivot.position.distanceTo(roamTarget);
          if (dist < 0.1) {
            roamTarget.set((Math.random() - 0.5) * 2.4, 0, (Math.random() - 0.5) * 1.4 - 0.2);
          }
          charPivot.position.lerp(roamTarget, dt * 0.75);
          charPivot.position.y = Math.abs(Math.sin(t * 5.0)) * 0.025;
          const targetAngle = Math.atan2(roamTarget.x - charPivot.position.x, roamTarget.z - charPivot.position.z) * 0.5 + pointer.x * 0.25;
          charPivot.rotation.y += (targetAngle - charPivot.rotation.y) * 0.05;
          charPivot.rotation.x += (0 - charPivot.rotation.x) * 0.08;
          charPivot.rotation.z += (0 - charPivot.rotation.z) * 0.08;
        } else if (currentState === 'COUCH') {
          const seatPos = new THREE.Vector3(-1.35, 0.22, -1.1);
          charPivot.position.lerp(seatPos, dt * 1.6);
          charPivot.rotation.y += (0.25 + pointer.x * 0.15 - charPivot.rotation.y) * 0.06;
          charPivot.rotation.x += (0.04 - charPivot.rotation.x) * 0.06;
          charPivot.rotation.z += (0 - charPivot.rotation.z) * 0.06;
        } else if (currentState === 'DOOMSCROLLING') {
          const seatPos = new THREE.Vector3(-1.35, 0.22, -1.1);
          charPivot.position.lerp(seatPos, dt * 1.6);
          charPivot.rotation.y += (0.25 - charPivot.rotation.y) * 0.06;
          charPivot.rotation.x += (0.14 + Math.sin(t * 1.8) * 0.02 - charPivot.rotation.x) * 0.06;
          charPivot.rotation.z += (0 - charPivot.rotation.z) * 0.06;
          phone.position.set(charPivot.position.x + 0.08, charPivot.position.y + 0.92, charPivot.position.z + 0.36);
          phone.rotation.set(-0.35, 0.25, 0);
        } else if (currentState === 'SLEEPING') {
          const sleepPos = new THREE.Vector3(-1.45, 0.26, -1.15);
          charPivot.position.lerp(sleepPos, dt * 1.4);
          charPivot.position.y += Math.sin(t * 1.1) * 0.008;
          charPivot.rotation.y += (0.35 - charPivot.rotation.y) * 0.05;
          charPivot.rotation.z += (0.42 - charPivot.rotation.z) * 0.04;
          charPivot.rotation.x += (0.08 - charPivot.rotation.x) * 0.04;

          zzzGroup.position.set(charPivot.position.x - 0.15, charPivot.position.y + 1.35, charPivot.position.z + 0.1);
          zSprites.forEach((sp, i) => {
            const phase = (t * 0.6 + i * 0.33) % 1;
            sp.position.set(Math.sin(phase * 4) * 0.06, phase * 0.45, 0);
            sp.material.opacity = Math.sin(phase * Math.PI);
          });
        }
      }

      // Subtle glass-wall camera parallax
      camera.position.x += (pointer.x * 0.18 - camera.position.x) * 0.04;
      camera.position.y += (1.45 - pointer.y * 0.1 - camera.position.y) * 0.04;
      camera.lookAt(0, 0.95, -0.5);

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
